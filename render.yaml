# Blueprint de Render: crea el servidor del modo pareja.
# Render → New → Blueprint → este repositorio. La DATABASE_URL se carga a mano (no va en el repo).
services:
  - type: web
    name: mydays-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio            # misma zona que la base de Neon (us-east-2)
    branch: main
    autoDeploy: true
    # Solo redesplegar cuando cambia el servidor: un cambio visual de la app no debe reiniciarlo
    buildFilter:
      paths:
        - server/**
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL   # la URL DIRECTA de Neon (sin -pooler)
        sync: false         # Render la pide en el momento de crear el servicio
      # Cobros con Mercado Pago (opcionales: sin estas dos, los pagos quedan apagados y la app muestra la demo)
      - key: MP_ACCESS_TOKEN  # Mercado Pago → Tus integraciones → Credenciales (empezá con las de PRUEBA: TEST-...)
        sync: false
      - key: MP_USD_RATE      # pesos por dólar para convertir USD 2,99 / 19,99 (ej. 1500)
        sync: false
