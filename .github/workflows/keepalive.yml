name: Mantener despierto el servidor

# El plan gratis de Render duerme el servidor tras 15 min sin tráfico, y dormido no puede
# mandar los recordatorios programados. Cada 5 minutos (el mínimo de GitHub) le "tocamos la puerta":
# GitHub suele demorar estas tareas (se vieron huecos de 16 min con */10), así que con */5 queda margen.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar mydays-server
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://mydays-server.onrender.com/actuator/health; then exit 0; fi
            sleep 20
          done
          exit 1
