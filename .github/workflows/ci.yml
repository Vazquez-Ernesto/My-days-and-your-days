name: CI

on:
  push:
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios
        run: npm test
      # Los tests E2E del modo pareja levantan el servidor Java real
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Maven Wrapper descarga Maven de Maven Central; a veces esa descarga falla en GitHub: reintentamos
      - name: Descargar Maven (con reintentos)
        working-directory: server
        run: for i in 1 2 3; do ./mvnw -q -v && break || { echo "Reintento $i…"; sleep 10; }; done
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests E2E
        run: npm run test:e2e
      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
